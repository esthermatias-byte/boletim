<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boletim Digital — 8A</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">

    <header class="header">
      <h1>Boletim Digital</h1>
      <p class="subtitle">8ª série — Turma 8A — Nº 9</p>
    </header>

    <!-- TELA DE ACESSO -->
    <section id="tela-login" class="card" style="max-width:420px;margin:0 auto 30px auto;">
      <h3>Acesso do estudante</h3>
      <p id="login-info" class="card-subtext" style="color:#a8a8b3;margin-bottom:12px;">
        8ª série • Turma 8A • Nº 9
      </p>
      <label for="input-pin" style="display:block;text-align:left;font-size:.85rem;color:#a8a8b3;margin-bottom:6px;">
        Digite seu PIN
      </label>
      <input
        id="input-pin"
        type="password"
        inputmode="numeric"
        autocomplete="off"
        placeholder="PIN"
        style="width:100%;padding:10px 12px;border-radius:6px;border:1px solid #29292e;background:#121214;color:#e1e1e6;font-size:1rem;margin-bottom:12px;"
      />
      <button
        id="btn-entrar"
        type="button"
        style="width:100%;padding:10px 12px;border-radius:6px;border:none;background:#00b4d8;color:#121214;font-weight:bold;font-size:1rem;cursor:pointer;"
      >
        Entrar
      </button>
      <p id="login-status" class="card-subtext" style="margin-top:10px;min-height:1.2em;"></p>
    </section>

    <!-- CONTEÚDO DO BOLETIM (oculto até o login) -->
    <main id="conteudo-boletim" style="display:none;">

      <div class="cards-grid">
        <div class="card">
          <h3>Média Geral</h3>
          <span id="card-media-geral" class="card-value">—</span>
        </div>
        <div class="card">
          <h3>Total de Faltas</h3>
          <span id="card-total-faltas" class="card-value">—</span>
        </div>
        <div class="card">
          <h3>Bom Desempenho</h3>
          <span id="card-bom-desempenho" class="card-value">—</span>
          <span class="card-subtext">disciplinas</span>
        </div>
        <div class="card">
          <h3>Em Atenção</h3>
          <span id="card-atencao" class="card-value">—</span>
          <span class="card-subtext">disciplinas</span>
        </div>
      </div>

      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;">
        <button
          id="btn-alterar"
          type="button"
          style="padding:10px 14px;border-radius:6px;border:none;background:#00f5d4;color:#121214;font-weight:bold;cursor:pointer;"
        >
          Alterar dados
        </button>
        <button
          id="btn-salvar"
          type="button"
          style="padding:10px 14px;border-radius:6px;border:none;background:#00b4d8;color:#121214;font-weight:bold;cursor:pointer;display:none;"
        >
          Salvar alterações
        </button>
        <button
          id="btn-cancelar"
          type="button"
          style="padding:10px 14px;border-radius:6px;border:1px solid #29292e;background:#202024;color:#e1e1e6;font-weight:bold;cursor:pointer;display:none;"
        >
          Cancelar
        </button>
      </div>

      <p id="status-geral" class="card-subtext" style="margin-bottom:12px;min-height:1.2em;"></p>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Disciplina</th>
              <th>1º Tri</th>
              <th>2º Tri</th>
              <th>3º Tri</th>
              <th>Média</th>
              <th>Faltas (T1/T2/T3)</th>
              <th>Situação</th>
            </tr>
          </thead>
          <tbody id="tabela-corpo"></tbody>
        </table>
      </div>

    </main>

  </div>

  <script src="script.js"></script>
</body>
</html>
